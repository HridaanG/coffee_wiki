[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-wiki-pipeline"
version = "0.1.0"
description = "Static terroir and sensory extraction pipeline for Indian Specialty Coffee Index & Wiki"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.9",
    "supabase>=2.9",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]